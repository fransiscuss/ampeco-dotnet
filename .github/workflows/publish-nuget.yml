name: publish-nuget

# Publishes Ampeco.Sdk to public nuget.org using Trusted Publishing (OIDC):
# no long-lived API key is stored anywhere. The nuget/login step exchanges a
# short-lived GitHub OIDC token for a temporary API key (~1 hour validity).
#
# Required one-time setup on nuget.org (see README "Publishing"):
#   Account settings → Trusted Publishing → add a policy for this repo + workflow.
on:
  push:
    tags:
      - 'v*'        # e.g. v0.1.0, v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 0.1.1). Leave empty to use the csproj version.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # id-token: write is what allows GitHub to issue the OIDC token
    # that nuget/login exchanges for the temporary API key.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Use manual version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Pack
        run: >
          dotnet pack src/Ampeco.Sdk -c Release -o artifacts --no-build
          ${{ env.VERSION != '' && format('-p:Version={0}', env.VERSION) || '' }}

      # Exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      # NUGET_USER is your nuget.org profile name (not the e-mail address).
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbol package
        run: >
          dotnet nuget push "artifacts/*.snupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
