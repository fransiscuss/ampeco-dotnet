name: publish-nuget

# Publishes Ampeco.Sdk to public nuget.org when a release tag is pushed,
# or on demand from the Actions tab.
on:
  push:
    tags:
      - 'v*'        # e.g. v0.1.0, v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 0.1.1). Leave empty to use the csproj version.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Use manual version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Pack
        run: >
          dotnet pack src/Ampeco.Sdk -c Release -o artifacts --no-build
          ${{ env.VERSION != '' && format('-p:Version={0}', env.VERSION) || '' }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbol package
        run: >
          dotnet nuget push "artifacts/*.snupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
